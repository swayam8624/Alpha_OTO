name: research-tests
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests without brokerage, paid data or external AI
        run: PYTHONPATH=src python -m unittest discover -s tests -v
